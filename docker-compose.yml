version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart_agent_db
    environment:
      - POSTGRES_USER=smartagent
      - POSTGRES_PASSWORD=smartpassword
      - POSTGRES_DB=smartagent_db
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
